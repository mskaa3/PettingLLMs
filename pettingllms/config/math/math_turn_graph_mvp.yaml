defaults:
- ../ppo_trainer@models.model_0.ppo_trainer_config: eval
- _self_

workflow_type: turn
rollout_mode: no_tree
specialization: prompt

resource:
  nnodes: 1
  n_gpus_per_node: 8
  trust_remote_code: true

lora_rank: 16
lora_alpha: 32

env:
  name: math_env
  dataset: polaris
  benchmark: AIME24
  n_agents: 4
  max_turns: 3
  resolve: false
  multi_modal: false
  batched_init: true

base_models:
  policy_0:
    path: your base model path
    name: shared_model

agent_policy_configs:
  agent_configs:
    agent_0:
      name: decomposer_agent
      policy_name: shared_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.7
        top_p: 0.9
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.2
        top_p: 0.95
        top_k: 20
        min_p: 0.0
    agent_1:
      name: team_designer_agent
      policy_name: shared_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.5
        top_p: 0.9
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.2
        top_p: 0.95
        top_k: 20
        min_p: 0.0
    agent_2:
      name: graph_executor_agent
      policy_name: shared_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.0
        top_p: 1.0
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.0
        top_p: 1.0
        top_k: 20
        min_p: 0.0

multi_agent_interaction:
  turn_order:
  - decomposer_agent
  - team_designer_agent
  - graph_executor_agent
  parallel: false

training:
  device: cuda
  total_training_steps: 200
  keep_all_turns_no_tree: true
  entity: pettingllms
  project_name: pettingllms
  experiment_name: math_turn_graph_mvp
  logger:
  - console
  model_checkpoints_dir: checkpoints
  ray_wait_register_center_timeout: 300
  train_batch_size: 16
  train_sample_num: 4
  validate_sample_num: 3
  sample_temperature: 1
  val_freq: 10
  max_prompt_length: 4096
  max_response_length: 2048
  lora_rank: ${lora_rank}
  lora_alpha: ${lora_alpha}

models:
  model_0:
    path: ${base_models.policy_0.path}
    name: ${base_models.policy_0.name}
    ppo_trainer_config:
      filter_method: dapo
      filter_ratio: 0
      data:
        max_prompt_length: ${training.max_prompt_length}
        max_response_length: ${training.max_response_length}
      actor_rollout_ref:
        model:
          path: ${base_models.policy_0.path}
        rollout:
          temperature: ${training.sample_temperature}
          prompt_length: ${training.max_prompt_length}
          response_length: ${training.max_response_length}
          tensor_model_parallel_size: ${resource.n_gpus_per_node}
        trainer:
          n_gpus_per_node: ${resource.n_gpus_per_node}
          n_training_gpus_per_node: ${resource.n_gpus_per_node}
